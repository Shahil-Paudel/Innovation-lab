<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8000'ers — Interactive Panorama · Sagarmatha Treks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/peaks.css" />
</head>
<body>

  <section class="peaks-section" id="peaks" aria-label="The fourteen 8000 metre peaks">
    <div class="peaks-stage" id="peaksStage">
      <div class="peaks-range" id="peaksRange"></div>
    </div>

    <!-- prixa-style HUD: only appears when the range needs scrolling -->
    <div class="peaks-hud" id="peaksHud" aria-hidden="true">
      <span class="peaks-hint">drag to explore</span>
      <span class="peaks-track"><i id="peaksFill"></i></span>
      <span class="peaks-count" id="peaksCount">[1 / 14]</span>
    </div>

    <div class="peaks-foot">
      <a class="peaks-title" href="#peaks">
        8000’ers
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
        </svg>
      </a>
    </div>
  </section>

  <script src="js/peaks.js"></script>
</body>
</html>
